name: Bootstrap skills monorepo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-skills-monorepo.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import latest Skill sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf skills
          mkdir -p skills /tmp/wjl-skill-import

          git clone --depth 1 https://github.com/3ll3-3ll3/loveav.git /tmp/wjl-skill-import/loveav
          git clone --depth 1 https://github.com/3ll3-3ll3/university-form-ppt-skill.git /tmp/wjl-skill-import/university-form-ppt-skill

          rm -rf /tmp/wjl-skill-import/loveav/.git
          rm -rf /tmp/wjl-skill-import/university-form-ppt-skill/.git

          cp -a /tmp/wjl-skill-import/loveav skills/loveav
          cp -a /tmp/wjl-skill-import/university-form-ppt-skill skills/university-form-ppt-skill

          test -f skills/loveav/SKILL.md
          test -f skills/university-form-ppt-skill/SKILL.md
          test -f skills/university-form-ppt-skill/assets/certificate_template.pptx
          test -f skills/university-form-ppt-skill/assets/teacher_certificate_template.pptx

      - name: Commit imported Skills
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills
          if git diff --cached --quiet; then
            echo 'No Skill changes to commit.'
            exit 0
          fi
          git commit -m 'feat: migrate existing skills into monorepo'
          git push origin HEAD:main
